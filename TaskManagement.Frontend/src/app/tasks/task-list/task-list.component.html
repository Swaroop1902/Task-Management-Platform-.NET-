<div class="row mt-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
        <h2>Tasks</h2>
        <button class="btn btn-primary" (click)="openCreateModal()">Create Task</button>
    </div>
</div>
<hr>

<div class="row mb-3 g-2">
    <div class="col-md-2">
        <label class="form-label small">Status</label>
        <select class="form-select form-select-sm" [(ngModel)]="filterStatus" (change)="applyFilter()">
            <option value="">All Statuses</option>
            <option value="Open">Open</option>
            <option value="In Progress">In Progress</option>
            <option value="Blocked">Blocked</option>
            <option value="Completed">Completed</option>
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label small">Assignee</label>
        <select class="form-select form-select-sm" [(ngModel)]="filterAssigneeId" (change)="applyFilter()">
            <option [ngValue]="undefined">All Assignees</option>
            <option *ngFor="let user of users" [ngValue]="user.id">{{ user.username }}</option>
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label small">From Date</label>
        <input type="date" class="form-control form-control-sm" [(ngModel)]="filterStartDate" (change)="applyFilter()">
    </div>
    <div class="col-md-3">
        <label class="form-label small">To Date</label>
        <input type="date" class="form-control form-control-sm" [(ngModel)]="filterEndDate" (change)="applyFilter()">
    </div>
</div>

<div *ngIf="loading" class="text-center my-4">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Due Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let task of tasks">
                <td>{{ task.id }}</td>
                <td>
                    <a [routerLink]="['/tasks', task.id]" class="text-decoration-none fw-bold">{{ task.title }}</a>
                </td>
                <td>
                    <span class="badge w-100"
                        [ngClass]="{'bg-danger': task.priority === 'High', 'bg-warning text-dark': task.priority === 'Medium', 'bg-success': task.priority === 'Low'}">
                        {{ task.priority }}
                    </span>
                </td>
                <td>{{ task.status }}</td>
                <td>{{ task.dueDate | date:'shortDate' }}</td>
                <td>
                    <button class="btn btn-sm btn-outline-secondary me-2" (click)="openEditModal(task)">Edit</button>
                </td>
            </tr>
            <tr *ngIf="tasks.length === 0">
                <td colspan="6" class="text-center text-muted py-3">No tasks found.</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Simple Custom Modal -->
<div class="modal fade show d-block" tabindex="-1" *ngIf="showModal" style="background: rgba(0,0,0,0.5);">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{ isEditing ? 'Edit Task' : 'Create Task' }}</h5>
                <button type="button" class="btn-close" (click)="closeModal()"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" name="title" [(ngModel)]="currentTask.title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="desc" [(ngModel)]="currentTask.description"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" name="priority" [(ngModel)]="currentTask.priority">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status" [(ngModel)]="currentTask.status">
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Blocked">Blocked</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Assignee</label>
                        <select class="form-select" name="assignee" [(ngModel)]="currentTask.assigneeId">
                            <option [ngValue]="null">Unassigned</option>
                            <option *ngFor="let user of users" [ngValue]="user.id">{{ user.username }}</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" (click)="closeModal()">Cancel</button>
                <button type="button" class="btn btn-primary" [disabled]="!currentTask.title"
                    (click)="saveTask()">Save</button>
            </div>
        </div>
    </div>
</div>
